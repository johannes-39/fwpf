apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-project
  namespace: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-project
  template:
    metadata:
      labels:
        app: kubernetes-project
    spec:
      containers:
        - name: kubernetes-project
          image: kubernetes-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000